spring.application.name=compucel-api
server.port=8085
server.servlet.context-path=/api/v1/compucel
app.version=0.1.0

# Conexion a MariaDB. Los valores reales se pasan por variables de entorno, nunca en este archivo.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/compucel}
spring.datasource.username=${DB_USER:compucel}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
